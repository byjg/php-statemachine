# The two machines of example2.php.
#
# `fromDefinition()` reads a single machine, so a file describing more than one just nests
# them under a key each — the definition is a plain array and can live anywhere inside a
# larger configuration. Each one names the enum its states come from; here both halves of the
# product lifecycle are cases of the same enum.

# Where a product sits, decided purely by the quantity in hand.
#
#   __VOID__ --> IN_STOCK | LAST_UNITS | OUT_OF_STOCK
#
# The transitions are evaluated in the order declared and the first match wins, so keep
# mutually exclusive conditions here (or call throwErrorIfAmbiguousTransition()).
stock:
  enum: Product
  transitions:
    - from: __VOID__
      to: IN_STOCK
      condition: InStock
      action: Announce

    - from: __VOID__
      to: LAST_UNITS
      condition: LastUnits
      action: Announce

    - from: __VOID__
      to: OUT_OF_STOCK
      condition: OutOfStock
      action: Announce

# What is being done about a product that is running out. A list in `from` declares the same
# move out of several states: it is the declarative Transition::createMultiple().
resupply:
  enum: Product
  transitions:
    - from: [LAST_UNITS, OUT_OF_STOCK]
      to: NOT_REQUESTED
      condition: NothingRequested
      action: Announce

    - from: [LAST_UNITS, OUT_OF_STOCK]
      to: REQUESTED_RESUPPLY
      condition: ResupplyRequested
      action: Announce

    - from: [LAST_UNITS, OUT_OF_STOCK, REQUESTED_RESUPPLY]
      to: RESUPPLIED
      condition: Fulfilled
      action: Announce

    - from: [LAST_UNITS, OUT_OF_STOCK]
      to: UNAVAILABLE
      condition: Discontinued
      action: Announce
